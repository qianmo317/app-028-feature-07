services:
  app-028:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-028-feature-07:1.0.0
    container_name: app-028-feature-07
    ports:
      - '8168:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz || exit 1']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
